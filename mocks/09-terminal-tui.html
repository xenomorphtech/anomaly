<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ctxOS — terminal TUI</title>
<style>
  :root{
    --bg:#060906; --bg2:#0a0f0a;
    --grn:#3ee07a; --grn-dim:#1f8a4c; --grn-faint:#14532d;
    --amb:#ffb454; --amb-dim:#8a6a3e;
    --red:#ff6b5e; --blu:#61c3ff; --pur:#c792ea;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{background:var(--bg); color:var(--grn); font-family:var(--mono); font-size:13px;
    line-height:1.4; overflow:hidden;
    text-shadow:0 0 6px rgba(62,224,122,.25)}
  body::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:100;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply}
  a{color:var(--blu); text-decoration:none}
  a:hover{text-decoration:underline}

  .term{display:flex; flex-direction:column; height:100%; padding:4px 6px; position:relative}

  /* header */
  .hdr{display:flex; white-space:pre; overflow:hidden; flex-shrink:0; color:var(--grn-dim)}
  .hdr .ttl{color:var(--amb); text-shadow:0 0 8px rgba(255,180,84,.35)}
  .hdr .rat{color:var(--grn-dim)}
  .hdr .sp{flex:1; overflow:hidden}
  .hdr .lnk{cursor:pointer; color:var(--grn)}
  .hdr .lnk:hover{background:var(--grn); color:var(--bg); text-shadow:none}

  /* pane skeleton */
  .cols{display:flex; flex:1; min-height:0; gap:0}
  .col-l{width:44ch; flex-shrink:0; display:flex; flex-direction:column; min-height:0}
  .col-r{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0}
  .pane{display:flex; flex-direction:column; min-height:0}
  .pane .bline{display:flex; white-space:pre; color:var(--grn-dim); flex-shrink:0}
  .pane .bline .t{color:var(--grn); padding:0}
  .pane .bline .t .hot{color:var(--amb)}
  .pane .bline .fill{flex:1; overflow:hidden; white-space:nowrap}
  .pane.focused .bline{color:var(--grn)}
  .pane.focused .bline .t{background:var(--grn); color:var(--bg); text-shadow:none}
  .pane-body{flex:1; overflow-y:auto; min-height:0; scrollbar-width:none}
  .pane-body::-webkit-scrollbar{display:none}
  .tline{display:flex; white-space:pre}
  .tline .b{color:var(--grn-dim); flex-shrink:0}
  .tline .c{flex:1; overflow:hidden; white-space:pre; min-width:0}

  /* content coloring */
  .dim{color:var(--grn-dim)} .faint{color:var(--grn-faint)}
  .amb{color:var(--amb)} .red{color:var(--red)} .blu{color:var(--blu)} .pur{color:var(--pur)}
  .rev{background:var(--grn); color:var(--bg); text-shadow:none}
  .rev .dim,.rev .amb,.rev .red,.rev .blu,.rev .pur{color:var(--bg)}
  .sel-amb{background:var(--amb); color:var(--bg); text-shadow:none}
  .click{cursor:pointer}
  .click:hover .c, .click:hover{filter:brightness(1.35)}
  .blink{animation:blink 1.1s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}
  .flash{animation:rowflash 1.5s ease-out}
  @keyframes rowflash{0%{background:rgba(255,180,84,.35)} 100%{background:transparent}}
  .newrow{animation:rowflash 2s ease-out}

  /* status / cmd bars */
  .sbar{display:flex; white-space:pre; flex-shrink:0; background:var(--grn); color:var(--bg);
    text-shadow:none; overflow:hidden}
  .sbar .seg{cursor:pointer}
  .sbar .seg:hover{background:var(--bg); color:var(--grn)}
  .sbar .sp{flex:1}
  .sbar.amb-bar{background:var(--amb)}
  .cmdline{display:none; white-space:pre; flex-shrink:0; color:var(--amb)}
  .cmdline.open{display:flex}
  .cmdline input{flex:1; background:none; border:none; outline:none; color:var(--amb);
    font:inherit; text-shadow:inherit; caret-color:var(--amb)}
  .msgline{white-space:pre; flex-shrink:0; color:var(--grn-dim); min-height:1.4em; overflow:hidden}
  .msgline .ok{color:var(--grn)} .msgline .err{color:var(--red)}
  .cursor{display:inline-block; width:1ch; background:var(--grn); animation:blink 1.1s steps(2,start) infinite}

  /* pager */
  .pager{position:absolute; inset:1.5em 6px 0 6px; background:var(--bg); z-index:50;
    display:none; flex-direction:column}
  .pager.open{display:flex}
  .pager .pg-body{flex:1; overflow-y:auto; scrollbar-width:none; padding:0 1ch}
  .pager .pg-body::-webkit-scrollbar{display:none}
  .pager .pg-line{white-space:pre-wrap}
  .pg-foot{display:flex; white-space:pre; background:var(--amb); color:var(--bg); text-shadow:none}
  .pg-foot .seg{cursor:pointer; font-weight:700}
  .pg-foot .seg:hover{background:var(--bg); color:var(--amb)}
  .pg-foot .sp{flex:1}

  /* popup boxes (workflows / compare) */
  .popup{position:absolute; z-index:60; background:var(--bg); display:none; flex-direction:column;
    left:50%; top:14%; transform:translateX(-50%); width:min(76ch, 92vw);
    box-shadow:0 0 0 1px var(--grn-faint), 0 0 40px rgba(0,0,0,.8)}
  .popup.open{display:flex}
  .popup .pane-body{overflow:visible}
  .wrap .c{white-space:pre-wrap}
</style>
</head>
<body>
<div class="term" id="term">
  <div class="hdr">
    <span> <span class="ttl">ctxOS 0.4</span> <span class="rat">── TERMINAL/TUI: panes over pages — status is a table, history is a log, orientation is a pager, hands stay on keys ──</span></span>
    <span class="sp"></span>
    <span class="lnk" id="hWork"> workflows </span><span class="dim">│</span><span class="lnk" id="hCmp"> ⓘ compare </span><span class="dim">│</span><a href="index.html"> index.html </a>
  </div>

  <div class="cols" id="cols">
    <div class="col-l">
      <div class="pane" id="paneTree" style="flex:1"></div>
    </div>
    <div class="col-r">
      <div class="pane" id="paneAgents" style="flex:0 0 auto"></div>
      <div class="pane" id="paneLog" style="flex:1"></div>
    </div>
  </div>

  <div class="msgline" id="msgline"> <span class="dim">ready.</span></div>
  <div class="sbar" id="sbar"></div>
  <div class="cmdline" id="cmdline"><span>:</span><input id="cmdinput" spellcheck="false" autocomplete="off"></div>

  <div class="pager" id="pager">
    <div class="bline"><span>┌─ </span><span class="t"> BRIEFING — decision-gate-desync </span><span class="fill"></span><span>┐</span></div>
    <div class="pg-body" id="pgBody" tabindex="-1"></div>
    <div class="pg-foot" id="pgFoot"></div>
  </div>

  <div class="popup pane" id="popWork"></div>
  <div class="popup pane" id="popCmp"></div>
</div>

<script>
const WORLD = {
  now: "2026-08-22T14:30:00",
  projects: [
    { id: "albion", name: "Albion Automation", color: "#e0a458",
      status: "active", goal: "Fully autonomous gathering + market loop",
      agents: [
        { id: "packet-tracer", name: "packet-tracer", state: "working",
          task: "Instrument gate transition packets", lastReport: "12:41" },
        { id: "navigator", name: "navigator", state: "blocked",
          task: "Cross-map routing through gates", lastReport: "11:58",
          blockedOn: "decision-gate-desync" },
        { id: "market-bot", name: "market-bot", state: "idle",
          task: "Waiting on price feed refactor", lastReport: "09:12" }
      ],
      tasks: [
        { t: "Fix gate desync", state: "blocked" },
        { t: "Price feed refactor", state: "todo" },
        { t: "Resource route optimizer", state: "done" }
      ]},
    { id: "homelab", name: "Homelab Migration", color: "#6fb3d2",
      status: "active", goal: "Move all services from old NUC to Proxmox cluster",
      agents: [
        { id: "infra-agent", name: "infra-agent", state: "working",
          task: "Migrating Postgres volumes to new ZFS pool", lastReport: "14:07" }
      ],
      tasks: [
        { t: "Migrate Postgres volumes", state: "doing" },
        { t: "Move reverse proxy + certs", state: "todo" },
        { t: "Decommission old NUC", state: "todo" }
      ]},
    { id: "paper", name: "Anomaly Detection Paper", color: "#b58ee0",
      status: "deadline", goal: "Submit to conference — deadline Sep 5",
      agents: [],
      tasks: [
        { t: "Rerun eval on v2 dataset", state: "doing" },
        { t: "Write related-work section", state: "todo" },
        { t: "Address advisor comments", state: "blocked" }
      ]},
    { id: "apartment", name: "Apartment Hunt", color: "#7fc98a",
      status: "background", goal: "Find 2br under budget before Nov",
      agents: [],
      tasks: [
        { t: "Visit Riverside listing", state: "todo" },
        { t: "Compare commute times", state: "todo" }
      ]}
  ],
  captures: [
    { t: "idea: agents should emit confidence with every status report", ts: "13:22" },
    { t: "check if ZFS snapshot schedule survives migration", ts: "10:45" },
    { t: "landlord mentioned garage option?? follow up", ts: "yesterday" }
  ],
  events: [
    { ts: "09:12", proj: "albion", agent: "market-bot", kind: "status", t: "Paused: price feed schema changed upstream, refactor needed" },
    { ts: "10:03", proj: "paper", kind: "note", t: "Advisor replied: eval section needs v2 dataset numbers" },
    { ts: "10:45", proj: null, kind: "capture", t: "check if ZFS snapshot schedule survives migration" },
    { ts: "11:20", proj: "albion", agent: "packet-tracer", kind: "status", t: "Gate-probe run #2: emitted 1 move, restarted client — server position UNCHANGED" },
    { ts: "11:58", proj: "albion", agent: "navigator", kind: "blocked", t: "Blocked: cannot route through gates until desync strategy chosen" },
    { ts: "12:41", proj: "albion", agent: "packet-tracer", kind: "status", t: "Gate-probe run #3: same result. Server never applied any move after gate transition" },
    { ts: "13:22", proj: null, kind: "capture", t: "idea: agents should emit confidence with every status report" },
    { ts: "14:07", proj: "homelab", agent: "infra-agent", kind: "status", t: "Postgres volume 2/5 migrated, ETA 40m for remainder" }
  ],
  decisions: [
    { id: "decision-gate-desync", proj: "albion", state: "pending",
      title: "Gate desync fix: restart-probe vs re-handshake",
      options: ["Restart-probe: auto-restart client after each gate to resync",
                "Re-handshake: reverse-engineer and replay the gate handshake packets"],
      due: "today" },
    { id: "decision-eval-scope", proj: "paper", state: "pending",
      title: "Eval scope: rerun full grid or only v2 delta",
      options: ["Full grid (2 days compute)", "v2 delta only (4h, weaker claim)"],
      due: "Aug 25" }
  ],
  decisionContext: [
    { ts: "Aug 19 16:10", t: "navigator first reported chars 'rubber-banding' to gate entrance after transitions" },
    { ts: "Aug 19 18:34", t: "hypothesis 1: movement-lock flag not cleared — DISPROVEN (flag clears in packet trace)" },
    { ts: "Aug 20 11:02", t: "hypothesis 2: reliable-seq collision after zone load — DISPROVEN (seqs contiguous)" },
    { ts: "Aug 20 15:47", t: "key insight: all movement after gate is client-side prediction; server acks contain no position echo" },
    { ts: "Aug 21 12:30", t: "restart experiment: emit 1 move, restart client, read authoritative resume position → server never moved the char" },
    { ts: "Aug 21 12:55", t: "conclusion: server drops move stream after gate until a fresh handshake occurs. Two viable fixes identified" },
    { ts: "Aug 22 12:41", t: "packet-tracer run #3 confirms: reproducible 3/3 times" }
  ],
  incomingReport: { ts: "14:31", proj: "albion", agent: "packet-tracer", kind: "status",
    t: "Gate-probe run #4 complete: server pos unchanged after 3 moves — desync confirmed at handshake layer" }
};

/* ================= state ================= */
const S = {
  sel: 0,               // index into selectable tree rows (projects + inbox)
  filter: null,         // project id or null
  events: WORLD.events.slice(),
  captures: WORLD.captures.slice(),
  reported: false,
  decided: null,        // option index once committed
  pagerOpen: false,
  clock: "14:30"
};
const gate = WORLD.decisions[0];
const SELECTABLE = WORLD.projects.map(p=>p.id).concat(["inbox"]);
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const FILL = "─".repeat(400);

/* ================= pane scaffolding ================= */
function top(title){ return `<div class="bline"><span>┌─ </span><span class="t">${title}</span><span class="fill"> ${FILL}</span><span>┐</span></div>`; }
function bot(){ return `<div class="bline"><span>└</span><span class="fill">${FILL}</span><span>┘</span></div>`; }
function L(content, opts={}){
  const cls = "tline" + (opts.cls?" "+opts.cls:"");
  const attr = opts.attr||"";
  return `<div class="${cls}" ${attr}><span class="b">│ </span><span class="c">${content}</span><span class="b"> │</span></div>`;
}

/* ================= left pane: project tree ================= */
const ST_ICON = { active:["●",""], deadline:["◆","red"], background:["○","faint"] };
const TASK_ICON = { done:["[×]","faint"], doing:["[◐]","amb"], todo:["[ ]","dim"], blocked:["[!]","red"] };

function renderTree(){
  let h = top(`projects <span class="hot">j/k</span> move · <span class="hot">↵</span> jump`);
  h += `<div class="pane-body">`;
  WORLD.projects.forEach((p, i)=>{
    const selected = S.sel === i;
    const [ic, icc] = ST_ICON[p.status];
    const jump = S.filter === p.id ? ` <span class="amb">◄ jumped</span>` : "";
    const nm = (selected?`<span class="rev"> ${ic} ${p.name.padEnd(24)} </span>`:` <span class="${icc}">${ic}</span> ${p.name}`);
    h += L(nm + `<span class="dim"> ${p.status}</span>` + jump,
      { cls:"click tree-row", attr:`data-i="${i}"` });
    h += L(`   <span class="faint">└ ${esc(p.goal.slice(0,36))}${p.goal.length>36?"…":""}</span>`);
    p.tasks.forEach(t=>{
      let st = t.state;
      if (p.id==="albion" && t.t==="Fix gate desync" && S.decided!==null) st = "doing";
      const [ti, tc] = TASK_ICON[st];
      h += L(`   <span class="${tc}">${ti}</span> <span class="${st==="done"?"faint":""}">${esc(t.t)}</span>`);
    });
    if (p.id === "albion"){
      if (S.decided === null){
        h += L(`   <span class="sel-amb blink">⚑ DECISION PENDING</span> <span class="amb">gate desync — due today</span>`,
          { cls:"click", attr:`id="decRow" title=":decide"` });
      } else {
        h += L(`   <span class="rev"> ✓ DECIDED </span> chose ${S.decided===0?"restart-probe":"re-handshake"} <span class="dim">14:32</span>`);
      }
    }
    if (p.id === "paper")
      h += L(`   <span class="amb">⚑</span> <span class="dim">eval scope — due Aug 25</span>`);
    h += L("");
  });
  // inbox
  const selInbox = S.sel === WORLD.projects.length;
  const head = selInbox ? `<span class="rev"> ~ inbox ${String("("+S.captures.length+" unsorted)").padEnd(20)} </span>`
                        : ` <span class="pur">~</span> inbox <span class="dim">(${S.captures.length} unsorted)</span>`;
  h += L(head, { cls:"click tree-row", attr:`data-i="${WORLD.projects.length}"` });
  S.captures.slice(0,4).forEach((c,ix)=>{
    h += L(`   <span class="faint">${c.ts.padStart(9)}</span> <span class="${ix===0&&c._fresh?"amb":"dim"}">${esc(c.t.slice(0,30))}${c.t.length>30?"…":""}</span>`,
      c._fresh && ix===0 ? {cls:"newrow"} : {});
  });
  h += `</div>` + bot();
  $("paneTree").innerHTML = h;
  $("paneTree").querySelectorAll(".tree-row").forEach(el=>
    el.addEventListener("click", ()=>{ S.sel = +el.dataset.i; doJump(); }));
  const dr = $("decRow");
  if (dr) dr.addEventListener("click", ev=>{ ev.stopPropagation(); openPager(); });
}

/* ================= top-right: agent table ================= */
const AG_COL = { working:"", blocked:"red", idle:"dim", ready:"blu" };
function agentRows(){
  const rows = [];
  WORLD.projects.forEach(p => p.agents.forEach(a => rows.push({p, a})));
  return rows;
}
function renderAgents(){
  let h = top(`agents <span class="hot">r</span> simulate report`);
  h += `<div class="pane-body">`;
  h += L(`<span class="dim">${"AGENT".padEnd(15)}${"PROJ".padEnd(10)}${"STATE".padEnd(10)}${"LAST".padEnd(7)}TASK</span>`);
  h += L(`<span class="faint">${"─".repeat(90)}</span>`);
  agentRows().forEach(({p,a})=>{
    let state = a.state, last = a.lastReport;
    if (a.id==="packet-tracer" && S.reported) last = "14:31";
    if (a.id==="navigator" && S.decided!==null) state = "ready";
    const dimAll = S.filter && S.filter!==p.id;
    const stc = AG_COL[state] || "";
    const row = `${a.name.padEnd(15)}<span class="dim">${p.id.padEnd(10)}</span>`+
      `<span class="${stc}">${(state==="working"?"▶ working":state==="blocked"?"■ blocked":state==="idle"?"· idle":"◆ ready").padEnd(10)}</span>`+
      `<span class="dim">${last.padEnd(7)}</span>${esc(a.task.slice(0,42))}`;
    h += L(dimAll?`<span class="faint">${row.replace(/<[^>]+>/g,"")}</span>`:row,
      {cls: a._flash ? "flash":"", attr:""});
    a._flash = false;
  });
  h += L("");
  h += L(`<span class="dim click" id="btnReportRow">[ ▶ simulate agent report ]</span> <span class="faint">— or press r</span>`);
  h += `</div>` + bot();
  $("paneAgents").innerHTML = h;
  $("btnReportRow").addEventListener("click", simulateReport);
}

/* ================= bottom-right: event log ================= */
const KIND_COL = { status:"", blocked:"red", note:"blu", capture:"pur", decision:"amb" };
function renderLog(keepBottom=true){
  const flt = S.filter;
  let h = top(`events${flt?` <span class="hot">filter:${flt}</span> (:jump to clear)`: ` <span class="hot">c</span> capture · <span class="hot">:</span> cmd`}`);
  h += `<div class="pane-body" id="logBody">`;
  const evs = S.events.filter(e => !flt || e.proj === flt || (flt==="inbox" && !e.proj));
  evs.forEach((e, ix)=>{
    const proj = e.proj ? `[${e.proj}]`.padEnd(11) : `[inbox]`.padEnd(11);
    const agent = e.agent ? `<span class="dim">${e.agent}:</span> ` : "";
    const kc = KIND_COL[e.kind] ?? "";
    h += L(`<span class="dim">${e.ts.padEnd(6)}</span><span class="faint">${proj}</span>${agent}<span class="${kc}">${esc(e.t)}</span>`,
      { cls: (e._fresh ? "newrow " : "") + "wraprow" });
    e._fresh = false;
  });
  h += `</div>` + bot();
  $("paneLog").innerHTML = h;
  if (keepBottom){ const b = $("logBody"); b.scrollTop = b.scrollHeight; }
}

/* ================= status bar / cmdline ================= */
function renderSbar(){
  const segs = [
    `<span class="seg" data-k="c"> c capture </span>`,
    `<span class="seg" data-k="r"> r report </span>`,
    `<span class="seg" data-k="d"> d decide </span>`,
    `<span class="seg" data-k=":"> : cmd </span>`
  ].join("│");
  const dec = S.decided===null ? `<span> ⚑ 2 pending decisions </span>` : `<span> ⚑ 1 pending decision </span>`;
  $("sbar").innerHTML = ` NORMAL │${segs}│${dec}<span class="sp"></span><span> ${S.filter?("filter:"+S.filter+" │ "):""}4 projects │ 4 agents │ ${S.clock} </span><span class="cursor">&nbsp;</span> `;
  $("sbar").querySelectorAll(".seg").forEach(el=>
    el.addEventListener("click", ()=>handleKey(el.dataset.k)));
}
function msg(html){ $("msgline").innerHTML = " " + html; }

function openCmd(prefill=""){
  $("cmdline").classList.add("open");
  const inp = $("cmdinput");
  inp.value = prefill;
  inp.focus();
  msg(`<span class="dim">commands: <span class="ok">:jump &lt;proj&gt;</span> focus/filter · <span class="ok">:jump</span> clear · <span class="ok">:capture &lt;text&gt;</span> · <span class="ok">:decide</span> · esc cancel</span>`);
}
function closeCmd(){
  $("cmdline").classList.remove("open");
  $("cmdinput").value = "";
  $("cmdinput").blur();
}
function runCmd(raw){
  const s = raw.trim();
  closeCmd();
  if (!s) return;
  const [cmd, ...rest] = s.split(/\s+/);
  const arg = rest.join(" ");
  if (cmd === "jump"){
    if (!arg){ S.filter = null; refresh(); msg(`<span class="ok">filter cleared.</span>`); return; }
    const hit = SELECTABLE.find(id => id.startsWith(arg.toLowerCase()));
    if (!hit){ msg(`<span class="err">no such project: ${esc(arg)}</span>`); return; }
    S.sel = SELECTABLE.indexOf(hit);
    doJump();
  } else if (cmd === "capture"){
    if (!arg){ msg(`<span class="err">usage: :capture &lt;text&gt;</span>`); return; }
    doCapture(arg);
  } else if (cmd === "decide"){
    openPager();
  } else if (cmd === "q" || cmd === "quit"){
    msg(`<span class="dim">this terminal has nowhere else to be.</span>`);
  } else {
    msg(`<span class="err">unknown command: ${esc(cmd)}</span> <span class="dim">(try :jump, :capture, :decide)</span>`);
  }
}

/* ================= workflow 1: capture ================= */
function doCapture(text){
  S.clock = "14:32";
  S.captures.unshift({ t:text, ts:"14:32", _fresh:true });
  S.events.push({ ts:"14:32", proj:null, kind:"capture", t:text, _fresh:true });
  refresh();
  msg(`<span class="ok">✓ captured → ~ inbox</span> <span class="dim">(unsorted; classify never)</span>`);
}

/* ================= workflow 2: agent report ================= */
function simulateReport(){
  if (S.reported){ msg(`<span class="dim">packet-tracer: no new output since 14:31.</span>`); return; }
  S.reported = true;
  S.clock = "14:31";
  const e = Object.assign({_fresh:true}, WORLD.incomingReport);
  S.events.push(e);
  WORLD.projects[0].agents[0]._flash = true;
  refresh();
  msg(`<span class="amb">▶ packet-tracer</span> <span class="ok">reported 14:31</span> <span class="dim">— appended to events, table updated. focus untouched.</span>`);
}

/* ================= workflow 3: decision pager ================= */
function openPager(){
  if (S.decided !== null){ msg(`<span class="dim">decision-gate-desync already resolved (${S.decided===0?"restart-probe":"re-handshake"}).</span>`); return; }
  S.pagerOpen = true;
  const B = [];
  const P = (t, cls="") => B.push(`<div class="pg-line ${cls}">${t}</div>`);
  P(``);
  P(`  <span class="amb">DECISION</span>  ${esc(gate.title)}`);
  P(`  <span class="dim">project: albion · due: today · blocks: navigator (cross-map routing)</span>`);
  P(`  <span class="faint">${"═".repeat(72)}</span>`);
  P(``);
  P(`  <span class="dim">Everything that led here, oldest first. Scroll like less; decide at the end.</span>`);
  P(``);
  WORLD.decisionContext.forEach(c=>{
    const hot = c.t.startsWith("key insight") || c.t.startsWith("conclusion");
    P(`  <span class="dim">${c.ts.padEnd(14)}</span><span class="${hot?"amb":""}">${esc(c.t)}</span>`);
    P(``);
  });
  if (S.reported){
    P(`  <span class="dim">${"Aug 22 14:31".padEnd(14)}</span><span>run #4: reproducible 4/4 — confidence very high</span>`);
    P(``);
  }
  P(`  <span class="faint">${"═".repeat(72)}</span>`);
  P(``);
  P(`  <span class="amb">[1]</span> ${esc(gate.options[0])}`);
  P(`      <span class="dim">+ ships today, dumb and reliable   − ~3 min penalty per gate</span>`);
  P(``);
  P(`  <span class="amb">[2]</span> ${esc(gate.options[1])}`);
  P(`      <span class="dim">+ clean permanent fix               − est. 2–3 days protocol work</span>`);
  P(``);
  P(`  <span class="faint">(END)</span>`);
  $("pgBody").innerHTML = B.join("");
  $("pgFoot").innerHTML = ` briefing 1/1 (END) <span class="sp"></span><span class="seg" id="pgOpt1"> [1] restart-probe </span> <span class="seg" id="pgOpt2"> [2] re-handshake </span> <span class="seg" id="pgQuit"> q:back </span> <span>↑↓ scroll </span>`;
  $("pager").classList.add("open");
  $("pgBody").scrollTop = 0;
  $("pgOpt1").addEventListener("click", ()=>commitDecision(0));
  $("pgOpt2").addEventListener("click", ()=>commitDecision(1));
  $("pgQuit").addEventListener("click", closePager);
  msg(`<span class="dim">pager: <span class="ok">1</span>/<span class="ok">2</span> commit · <span class="ok">q</span> back · ↑↓/j/k scroll</span>`);
}
function closePager(){
  S.pagerOpen = false;
  $("pager").classList.remove("open");
  msg(`<span class="dim">back to panes.</span>`);
}
function commitDecision(idx){
  S.decided = idx;
  gate.state = "resolved";
  S.clock = "14:32";
  const chosen = idx===0 ? "restart-probe" : "re-handshake";
  S.events.push({ ts:"14:32", proj:"albion", kind:"decision", _fresh:true,
    t:`decision resolved: chose ${chosen} — navigator unblocked, routing work resumes` });
  const nav = WORLD.projects[0].agents.find(a=>a.id==="navigator");
  nav._flash = true;
  S.pagerOpen = false;
  $("pager").classList.remove("open");
  refresh();
  msg(`<span class="ok">✓ committed: ${chosen}</span> <span class="dim">— [DECISION PENDING] cleared, event appended, navigator → ready.</span>`);
}

/* ================= selection / jump ================= */
function doJump(){
  const id = SELECTABLE[S.sel];
  S.filter = (S.filter === id) ? null : id;
  refresh();
  msg(S.filter
    ? `<span class="ok">jumped to ${id}</span> <span class="dim">— events filtered; :jump or ↵ again to clear.</span>`
    : `<span class="dim">filter cleared.</span>`);
}
function moveSel(d){
  S.sel = (S.sel + d + SELECTABLE.length) % SELECTABLE.length;
  renderTree();
}

/* ================= popups ================= */
function popupHTML(title, lines){
  return top(title) + `<div class="pane-body">` +
    lines.map(l=>L(l, {cls:"wrap"})).join("") + `</div>` + bot();
}
function toggleWork(){
  const el = $("popWork"); $("popCmp").classList.remove("open");
  if (el.classList.toggle("open")){
    el.innerHTML = popupHTML(`TRY THE WORKFLOWS <span class="hot">esc</span> close`, [
      ``,
      `<span class="amb">1. capture</span> — press <span class="rev"> c </span> (or click "c capture" in the bar),`,
      `   type your thought after <span class="amb">:capture</span>, hit ↵. Lands in <span class="pur">~ inbox</span>`,
      `   unsorted, plus a [inbox] line in events.`,
      ``,
      `<span class="amb">2. agent report</span> — press <span class="rev"> r </span> or click [ ▶ simulate agent`,
      `   report ] in the agents pane (auto-fires ~8s after load). New`,
      `   event scrolls in; packet-tracer row flashes. No focus theft.`,
      ``,
      `<span class="amb">3. orient &amp; decide</span> — press <span class="rev"> d </span>, type <span class="amb">:decide</span>, or click the`,
      `   blinking <span class="sel-amb">⚑ DECISION PENDING</span> line under albion. A less-style`,
      `   pager shows the full briefing; press <span class="amb">1</span> or <span class="amb">2</span> (or click the`,
      `   footer) to commit. <span class="amb">q</span> backs out.`,
      ``
    ]);
  }
}
function toggleCmp(){
  const el = $("popCmp"); $("popWork").classList.remove("open");
  if (el.classList.toggle("open")){
    el.innerHTML = popupHTML(`ⓘ PARADIGM TRADE-OFFS <span class="hot">esc</span> close`, [
      ``,
      `<span class="amb">strengths</span>`,
      ` <span class="dim">+</span> zero-latency: capture, jump, decide without touching the mouse`,
      ` <span class="dim">+</span> everything visible at once — agents, log, tree share one screen`,
      ` <span class="dim">+</span> the pager forces linear re-reading: good pre-decision ritual`,
      ``,
      `<span class="red">weaknesses</span>`,
      ` <span class="dim">−</span> steep learning curve; commands must be memorized`,
      ` <span class="dim">−</span> fixed-density text can't emphasize by layout, only by color`,
      ` <span class="dim">−</span> long prose (briefs, memos) reads worse than in a document UI`,
      ``
    ]);
  }
}

/* ================= keyboard ================= */
function handleKey(k){
  if (k === ":") openCmd("");
  else if (k === "c") openCmd("capture ");
  else if (k === "r") simulateReport();
  else if (k === "d") openPager();
}
document.addEventListener("keydown", e=>{
  const inCmd = document.activeElement === $("cmdinput");
  if (inCmd){
    if (e.key === "Enter"){ runCmd($("cmdinput").value); e.preventDefault(); }
    else if (e.key === "Escape"){ closeCmd(); msg(`<span class="dim">cancelled.</span>`); }
    return;
  }
  if (S.pagerOpen){
    if (e.key === "1") commitDecision(0);
    else if (e.key === "2") commitDecision(1);
    else if (e.key === "q" || e.key === "Escape") closePager();
    else if (e.key === "j" || e.key === "ArrowDown") $("pgBody").scrollBy(0, 24);
    else if (e.key === "k" || e.key === "ArrowUp") $("pgBody").scrollBy(0, -24);
    e.preventDefault();
    return;
  }
  if (e.key === ":"){ openCmd(""); e.preventDefault(); }
  else if (e.key === "c"){ handleKey("c"); e.preventDefault(); }
  else if (e.key === "r") handleKey("r");
  else if (e.key === "d") handleKey("d");
  else if (e.key === "j" || e.key === "ArrowDown"){ moveSel(1); e.preventDefault(); }
  else if (e.key === "k" || e.key === "ArrowUp"){ moveSel(-1); e.preventDefault(); }
  else if (e.key === "Enter") doJump();
  else if (e.key === "Escape"){ $("popWork").classList.remove("open"); $("popCmp").classList.remove("open"); }
});
$("cmdinput").addEventListener("keydown", e=>e.stopPropagation());
$("cmdinput").addEventListener("keydown", e=>{
  if (e.key === "Enter") runCmd($("cmdinput").value);
  else if (e.key === "Escape"){ closeCmd(); msg(`<span class="dim">cancelled.</span>`); }
});
$("hWork").addEventListener("click", toggleWork);
$("hCmp").addEventListener("click", toggleCmp);

/* ================= boot ================= */
function refresh(){ renderTree(); renderAgents(); renderLog(); renderSbar(); }
refresh();
msg(`<span class="dim">ready. <span class="ok">j/k</span> move · <span class="ok">↵</span> jump · <span class="ok">c</span> capture · <span class="ok">r</span> report · <span class="ok">d</span> decide · <span class="ok">:</span> cmd — everything also clickable.</span>`);
setTimeout(()=>{ if(!S.reported) simulateReport(); }, 8000);
</script>
