[package]
name = "commander"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.32"
chrono = "0.4"
tiny_http = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = "45"
ureq = "2"
# host (X11) clipboard: the nested weston has its own, isolated clipboard
arboard = { version = "3", default-features = false }
libc = "0.2"

[profile.dev]
opt-level = 1
